[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "journal-matcher-services"
version = "0.1.0"
description = "API and worker shells for Journal Matcher"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.139.2",
  "pydantic-settings==2.10.1",
  "matplotlib==3.11.1",
  "python-docx==1.2.0",
  "pypdf==6.14.2",
  "starlette==1.3.1",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.7",
]

[tool.setuptools.packages.find]
where = ["apps/api/src", "apps/worker/src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=journal_matcher_api --cov=journal_matcher_worker --cov-report=term-missing --cov-fail-under=90"
pythonpath = ["apps/api/src", "apps/worker/src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
